[package]
name = "muse-e2e"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Executable import and playlist stories with Cucumber step definitions for muse"
license = "AGPL-3.0-only"
publish = false

[dev-dependencies]
cucumber = "0.23.0"
futures = { version = "0.3", default-features = false, features = ["executor"] }
muse-library = { path = "../muse-library" }
muse-playback = { path = "../muse-playback", features = ["native"] }
tempfile = "3.23"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = "0.4.3"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", features = ["process"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[[test]]
name = "import"
path = "tests/import.rs"
harness = false
