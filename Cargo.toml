[workspace]
members = ["crates/muse", "crates/muse-library", "crates/muse-playback", "crates/muse-e2e"]
default-members = ["crates/muse"]
resolver = "3"

# Keep application debugging while making full-file hashing practical.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
