[package]
name = "muse-playback"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Playback interfaces for muse"
license = "AGPL-3.0-only"
publish = false

[features]
default = []
native = ["dep:rodio", "dep:symphonia"]

[dependencies]
rodio = { version = "0.22.2", default-features = false, features = ["playback"], optional = true }
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "flac"], optional = true }
