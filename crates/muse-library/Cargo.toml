[package]
name = "muse-library"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Local music storage and import for muse"
license = "AGPL-3.0-only"
publish = false

[dependencies]
aes = "0.8.4"
base64 = "0.22.1"
lofty = "0.25.4"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
rusqlite_migration = "2.6.0"
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "2.0"
tempfile = "3.23"
walkdir = "2.5"
