name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify version tag
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          manifest = tomllib.loads(Path("crates/muse/Cargo.toml").read_text(encoding="utf-8"))
          expected = f"v{manifest['package']['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Tag {actual!r} does not match Cargo version {expected!r}")
          PY
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Install Linux audio build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Check standard-library playback interface
        run: cargo check -p muse-playback --locked --no-default-features
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: |
          cargo test --workspace --locked --all-targets --all-features
          cargo test --workspace --locked --doc --all-features
      - name: Build release binary
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: cargo build --workspace --locked --release --target "$RELEASE_TARGET"
      - name: Package binary and license
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/package-release.py --target "$RELEASE_TARGET" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            release_flags=()
            case "$RELEASE_TAG" in
              *-*) release_flags+=(--prerelease) ;;
            esac
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --generate-notes --title "$RELEASE_TAG" \
              "${release_flags[@]}"
          fi
