[package]
name = "muse"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A terminal music player with Neovim-style interaction"
license = "AGPL-3.0-only"
readme = "../../README.md"
publish = false

[dependencies]
muse-playback = { path = "../muse-playback", features = ["native"] }
muse-library = { path = "../muse-library" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29.0"

[dev-dependencies]
tempfile = "3.23"
